<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><style>html,body{margin:0;height:100%;background:#0b0806;overflow:hidden}[hidden]{display:none!important}</style></head><body><title>Wheel of Samsara</title>
<meta name="theme-color" content="#0b0806">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700;900&display=swap">
<style>
/* Layout: one full-bleed canvas world; DOM HUD pinned to safe-area edges; D2-style carved-stone panels float above. */
:root{
  --ink:#0b0806; --stone:#1c1712; --stone2:#2a221a; --stone3:#3a2f24; --edge:#5c4a34; --edge-hi:#8a7050;
  --gold:#c9a45c; --gold-hi:#f3dc9a; --text:#d9cdb3; --dim:#8d806a; --faint:#5d5345;
  --magic:#7b86ff; --rare:#f0dc5a; --unique:#cfae6c; --set:#4fd34f; --sock:#9a9a9a; --quest:#e39a3c;
  --life:#b5231b; --mana:#2b51c8; --good:#6fcf6f; --bad:#e0564a;
  --fire:#ff7a2e; --cold:#7fc8ff; --light:#ffe066; --void:#b77dff; --spirit:#fff2c8; --phys:#e8e0d0;
  --f-logo:"Cinzel Decorative","Cinzel","Trajan Pro",Georgia,serif;
  --f-ui:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif;
  --f-body:"Alegreya","Palatino Linotype","Book Antiqua",Georgia,serif;
  --s:1;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--f-ui);color:var(--gold);cursor:pointer}
button:focus-visible,.slot:focus-visible,input:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

/* ---------- Carved stone surfaces ---------- */
.stone{
  background:
    radial-gradient(120% 90% at 30% 20%, rgba(255,230,190,.05), transparent 60%),
    repeating-linear-gradient(115deg, rgba(0,0,0,.08) 0 2px, transparent 2px 7px),
    linear-gradient(180deg,#261f18,#16110d);
  border:2px solid var(--edge);
  box-shadow:inset 0 0 0 1px #000, inset 0 0 24px rgba(0,0,0,.8), 0 10px 40px rgba(0,0,0,.7);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  font-family:var(--f-ui);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--gold);font-size:15px;padding:.7em 1.2em;min-height:44px;
  background:linear-gradient(180deg,#3b3127 0%,#231c15 55%,#18130e 100%);
  border:2px solid #6b5840;border-top-color:#8f7757;border-bottom-color:#3a2e21;
  box-shadow:inset 0 1px 0 rgba(255,230,180,.15), inset 0 -2px 0 rgba(0,0,0,.4), 0 2px 0 #000;
  text-shadow:0 1px 0 #000,0 0 8px rgba(0,0,0,.8);
  transition:filter .12s, transform .06s, color .12s;
}
.btn:hover{color:var(--gold-hi);filter:brightness(1.18)}
.btn:active{transform:translateY(1px);filter:brightness(.95)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.small{font-size:12px;padding:.45em .8em;min-height:34px}
.btn.wide{width:100%}
.btn.red{color:#ff9c8c}

/* ---------- Title & menus ---------- */
#screen{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));box-sizing:border-box;overflow:auto;touch-action:pan-y}
#screen[hidden]{display:none!important}
.logo{font-family:var(--f-logo);font-weight:900;text-align:center;line-height:.9;margin:0;
  font-size:clamp(38px,9vw,96px);letter-spacing:.02em;
  background:linear-gradient(180deg,#fff4c9 0%,#f2c96a 35%,#c7801f 62%,#7a3a0c 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,140,40,.45)) drop-shadow(0 3px 0 #000);text-wrap:balance}
.logo small{display:block;font-family:var(--f-ui);font-weight:600;font-size:.22em;letter-spacing:.5em;margin-top:.9em;
  background:none;color:#d8b77a;-webkit-text-fill-color:#d8b77a;filter:none;text-shadow:0 2px 6px #000}
.menu{display:flex;flex-direction:column;gap:10px;width:min(340px,86vw);margin-top:clamp(20px,5vh,48px)}
.menu .btn{font-size:clamp(14px,2.2vw,18px);padding:.8em 1em}
.foot{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-family:var(--f-ui);font-size:11px;letter-spacing:.2em;color:var(--faint)}
.screen-title{font-family:var(--f-ui);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-size:clamp(18px,3vw,26px);text-align:center;margin:0 0 14px;text-shadow:0 2px 8px #000}
.card-list{display:flex;flex-direction:column;gap:8px;width:min(520px,92vw);max-height:52vh;overflow:auto;padding:4px}
.char-card{display:flex;gap:12px;align-items:center;padding:10px 12px;cursor:pointer;border:2px solid #3a2f23;background:linear-gradient(90deg,rgba(40,32,24,.9),rgba(18,14,10,.9))}
.char-card.sel{border-color:var(--gold);box-shadow:0 0 16px rgba(201,164,92,.35)}
.char-card canvas{width:56px;height:64px;flex:none}
.char-card .nm{font-family:var(--f-ui);font-weight:700;color:var(--gold-hi);font-size:17px;letter-spacing:.06em}
.char-card .sub{font-size:14px;color:var(--dim)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lore{font-family:var(--f-body);font-style:italic;color:#cbbd9f;line-height:1.5;max-width:62ch;text-align:center;font-size:clamp(15px,1.9vw,19px);text-wrap:pretty}
.create-ui{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(620px,94vw);padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.create-ui h3{margin:0;font-family:var(--f-ui);color:var(--gold-hi);letter-spacing:.1em;font-size:20px}
.create-ui p{margin:0;font-size:15px;line-height:1.4;color:var(--text)}
.create-ui .treelist{font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;color:var(--dim);margin-top:4px}
.name-in{font-family:var(--f-ui);font-size:17px;color:var(--gold-hi);background:#0e0b08;border:2px solid var(--edge);padding:.55em .7em;min-width:0;flex:1;letter-spacing:.06em}
.opt-grid{display:grid;grid-template-columns:1fr auto;gap:12px 18px;align-items:center;width:min(460px,90vw);font-family:var(--f-ui);font-size:14px;letter-spacing:.06em}
.opt-grid input[type=range]{width:160px;accent-color:var(--gold)}
.opt-grid select{font-family:var(--f-ui);background:#120e0a;color:var(--gold-hi);border:1px solid var(--edge);padding:4px}
.toggle{width:52px;height:28px;border-radius:14px;border:2px solid var(--edge);background:#120e0a;position:relative;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:left .15s,background .15s}
.toggle.on::after{left:27px;background:var(--gold)}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud[hidden]{display:none!important}
#hud .pe{pointer-events:auto}
#topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) 0 calc(env(safe-area-inset-left,0px) + 10px)}
#areaName{font-family:var(--f-ui);font-weight:700;letter-spacing:.12em;color:var(--gold-hi);text-shadow:0 2px 4px #000,0 0 10px #000;font-size:calc(13px*var(--s) + 3px);line-height:1.2}
#areaName small{display:block;font-weight:500;color:var(--dim);font-size:.72em;letter-spacing:.2em}
#minimap{position:absolute;right:calc(env(safe-area-inset-right,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 50px);width:calc(150px*var(--s));height:calc(110px*var(--s));opacity:.85;pointer-events:none}
.topbtns{display:flex;gap:6px}
.ibtn{width:max(36px,calc(40px*var(--s)));height:max(36px,calc(40px*var(--s)));padding:0;display:grid;place-items:center;
  background:linear-gradient(180deg,#342a20,#18120d);border:2px solid #5d4b35;border-top-color:#86704f;color:var(--gold);
  box-shadow:0 2px 0 #000, inset 0 0 8px rgba(0,0,0,.6);font-size:calc(12px*var(--s) + 6px)}
.ibtn svg{width:60%;height:60%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn:hover{color:var(--gold-hi)}
.ibtn .dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:#f3c040;box-shadow:0 0 8px #ffcf4a;animation:pulse 1s infinite alternate}
.ibtn{position:relative}
@keyframes pulse{to{transform:scale(1.35);opacity:.7}}
#bossbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 54px);left:50%;transform:translateX(-50%);width:min(520px,64vw);text-align:center}
#bossbar .nm{font-family:var(--f-ui);font-weight:700;color:#ffcf8a;letter-spacing:.14em;font-size:calc(12px*var(--s) + 5px);text-shadow:0 2px 4px #000}
#bossbar .bar{height:12px;border:2px solid #5c4a34;background:#120505;margin-top:4px;box-shadow:0 0 12px #000;position:relative;overflow:hidden}
#bossbar .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#e84a2c,#8a120a);width:100%;transition:width .15s}
#toast{position:absolute;top:28%;left:0;right:0;text-align:center;pointer-events:none;font-family:var(--f-ui);font-weight:700}
#toast div{font-size:calc(14px*var(--s) + 8px);letter-spacing:.14em;color:var(--gold-hi);text-shadow:0 0 12px #000,0 2px 2px #000;animation:toastIn .35s ease-out;margin-bottom:6px}
#toast div.sub{font-size:calc(10px*var(--s) + 6px);color:var(--text);font-family:var(--f-body);font-style:italic;letter-spacing:.02em;font-weight:400}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.96)}}
#interact{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 150px*var(--s) + 30px)}
#botbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:center;gap:calc(10px*var(--s));
  padding:0 calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 6px) calc(env(safe-area-inset-left,0px) + 8px)}
.orbwrap{position:relative;width:calc(112px*var(--s));height:calc(112px*var(--s));flex:none}
.orbwrap canvas{width:100%;height:100%}
.orbwrap .val{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:var(--f-ui);font-weight:700;font-size:calc(8px*var(--s) + 5px);color:#fff;text-shadow:0 1px 2px #000,0 0 6px #000;white-space:nowrap;z-index:2;pointer-events:none}
.pot{position:absolute;top:calc(-10px*var(--s) - 6px);width:max(34px,calc(38px*var(--s)));height:max(34px,calc(38px*var(--s)));padding:0;border:2px solid #5d4b35;background:#120d09;display:grid;place-items:center;box-shadow:0 2px 0 #000}
.pot canvas{width:78%;height:78%}
.pot b{position:absolute;right:1px;bottom:0;font-family:var(--f-ui);font-size:11px;color:#fff;text-shadow:0 1px 2px #000}
.left .pot{right:calc(-14px*var(--s) - 8px)}
.right .pot{left:calc(-14px*var(--s) - 8px)}
.hudcenter{display:flex;flex-direction:column;align-items:center;gap:calc(5px*var(--s));padding:0 calc(14px*var(--s) + 4px) calc(4px*var(--s));min-width:0}
#skillbar{display:flex;gap:calc(4px*var(--s))}
.sk{width:calc(40px*var(--s) + 4px);height:calc(40px*var(--s) + 4px);border:2px solid #4c3d2c;background:#0e0a07;position:relative;box-shadow:0 2px 0 #000;overflow:hidden}
.sk canvas{width:100%;height:100%;display:block}
.sk .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) var(--p,0%),transparent 0)}
.sk.nomana canvas{filter:grayscale(1) brightness(.5) sepia(1) hue-rotate(190deg)}
.sk.evo{border-color:#f3dc9a;box-shadow:0 0 10px rgba(255,210,110,.7),0 2px 0 #000}
.sk .lv{position:absolute;right:1px;bottom:0;font-family:var(--f-ui);font-size:10px;color:var(--gold-hi);text-shadow:0 1px 1px #000}
#xpbar{width:100%;min-width:calc(250px*var(--s));height:6px;border:1px solid #4c3d2c;background:#0c0906;position:relative}
#xpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#f3d27a,#a67a22);width:0}
#menubtns{display:flex;gap:calc(4px*var(--s))}
#mantra{position:absolute;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 112px*var(--s) + 40px);
  width:max(54px,calc(62px*var(--s)));height:max(54px,calc(62px*var(--s)));border-radius:50%;padding:0;border:2px solid #6b5840;background:#100b07;display:grid;place-items:center;overflow:hidden}
#mantra canvas{width:100%;height:100%}
#mantra.ready{border-color:#f3dc9a;box-shadow:0 0 22px rgba(255,210,110,.8);animation:glow 1.1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 40px rgba(255,210,110,1)}}
#joy{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:2px solid rgba(232,196,120,.6);background:radial-gradient(circle,rgba(0,0,0,.05),rgba(0,0,0,.35));box-shadow:0 0 0 1px rgba(0,0,0,.5),inset 0 0 18px rgba(0,0,0,.5);pointer-events:none}
#joy .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3dc9a,#8a6a30 60%,#3a2a12);opacity:.8;box-shadow:0 0 14px rgba(0,0,0,.6)}
#labels{position:absolute;inset:0;pointer-events:none}

/* ---------- Panels ---------- */
#layer{position:absolute;inset:0;z-index:10;display:flex;align-items:flex-start;justify-content:center;background:rgba(5,3,2,.55);
  padding:calc(env(safe-area-inset-top,0px) + max(8px, 3vh)) calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 8px);box-sizing:border-box}
#layer .intro-card{position:fixed}
#layer[hidden]{display:none!important}
.panel{position:relative;width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;box-sizing:border-box;min-height:0}
.panel.narrow{width:min(460px,100%)}
.panel.wide{width:min(980px,100%)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 8px 16px;border-bottom:1px solid #3d3226;flex:none}
.ph h2{margin:0;font-family:var(--f-ui);font-weight:700;letter-spacing:.16em;color:var(--gold);font-size:18px;text-transform:uppercase}
.ph .x{width:38px;height:38px;padding:0;font-size:20px;background:#15100c;border:2px solid #5c4a34;color:var(--gold)}
.pb{padding:12px 14px 14px;overflow:auto;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:4px;padding:8px 12px 0;flex:none;flex-wrap:wrap}
.tab{font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;background:#15100b;border:1px solid #3d3226;border-bottom:none;color:var(--dim)}
.tab.on{color:var(--gold-hi);background:#2a2119;border-color:var(--edge)}
.sec{font-family:var(--f-ui);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:10px 0 6px}

/* inventory */
.invwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:760px){.invwrap.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.doll{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));grid-template-areas:"weapon head offhand" "weapon body offhand" "ring1 body ring2" "hands waist feet" ". neck .";gap:6px;max-width:300px;aspect-ratio:3/5;margin:0 auto;width:100%}
.doll>div{display:flex;min-width:0;min-height:0}.doll .slot{width:100%;height:100%;aspect-ratio:auto}
.slot{position:relative;aspect-ratio:1;min-width:0;background:radial-gradient(circle at 50% 40%,#1e1812,#0a0806);border:2px solid #3e3225;box-shadow:inset 0 0 10px #000;display:grid;place-items:center;cursor:pointer;padding:0}
.slot.tall{aspect-ratio:auto}
.slot canvas,.slot img{width:84%;height:84%;object-fit:contain;image-rendering:auto;pointer-events:none}
.slot .ghost{font-family:var(--f-ui);font-size:10px;letter-spacing:.08em;color:#4b4034;text-transform:uppercase;text-align:center}
.slot.r1{border-color:#3d4588}.slot.r2{border-color:#8c7d2c}.slot.r3{border-color:#8a6d3b;box-shadow:inset 0 0 14px rgba(207,174,108,.3)}.slot.r5{border-color:#555}
.slot.sel{outline:2px solid var(--gold-hi);outline-offset:1px}
.slot.bad{background:radial-gradient(circle,#3a0e0a,#120505)}
.slot .n{position:absolute;right:2px;bottom:0;font-family:var(--f-ui);font-size:11px;color:#fff;text-shadow:0 1px 2px #000}
.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.goldline{font-family:var(--f-ui);color:var(--gold-hi);font-size:15px;display:flex;align-items:center;gap:6px;letter-spacing:.06em}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff0b0,#d7a33a 55%,#7a5210);display:inline-block}

/* item tooltip */
.itip{font-family:var(--f-ui);text-align:center;font-size:14px;line-height:1.45;background:rgba(8,6,4,.97);border:1px solid #3d3226;padding:10px 12px;box-shadow:0 8px 24px #000}
.tipdock{margin-top:10px}
@media (max-width:759px){.tipdock{position:sticky;bottom:-14px;z-index:3;max-height:46vh;overflow:auto}}
.itip .nm{font-weight:700;font-size:16px;letter-spacing:.03em}
.itip .lore{font-size:13px;margin-top:6px;color:#a8977a}
.itip .stat{color:var(--magic)}
.itip .base{color:var(--text)}
.itip .req{color:var(--text)}.itip .req.no{color:var(--bad)}
.itip .gold{color:var(--gold-hi)}
.itip .cmp{font-size:12px;color:var(--dim);margin-top:6px}
.itip .cmp .up{color:var(--good)}.itip .cmp .dn{color:var(--bad)}
.c0{color:#e6e0d4}.c1{color:var(--magic)}.c2{color:var(--rare)}.c3{color:var(--unique)}.c5{color:var(--sock)}.c6{color:#f0a030}.cg{color:var(--quest)}
.slot.r6{border-color:#b8741a;box-shadow:inset 0 0 14px rgba(240,160,48,.3)}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}

/* character sheet */
.cs{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:640px){.cs{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px}
.kv .k{color:var(--dim);font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;align-self:center}
.kv .v{font-variant-numeric:tabular-nums;color:var(--text);text-align:right}
.attr{display:grid;grid-template-columns:1fr auto 44px;gap:6px 10px;align-items:center}
.attr .nm{font-family:var(--f-ui);font-weight:700;letter-spacing:.1em;color:var(--gold)}
.attr .nm small{display:block;font-family:var(--f-body);font-weight:400;letter-spacing:0;color:var(--dim);font-size:13px;text-transform:none}
.attr .v{font-size:20px;font-variant-numeric:tabular-nums;color:var(--gold-hi);text-align:right}
.plus{width:40px;height:40px;padding:0;font-size:22px;line-height:1;border:2px solid #6b5840;background:linear-gradient(#3b3127,#18130e);color:var(--gold-hi)}
.plus[disabled]{opacity:.2}
.pts{font-family:var(--f-ui);color:#ffd36a;letter-spacing:.08em;font-size:14px;text-align:center;margin:6px 0}

/* skills */
.trees{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.snode{position:relative;width:min(64px,20vw);aspect-ratio:1;border:2px solid #4a3c2b;padding:0;background:#0b0806;display:block}

.snode.locked canvas{filter:grayscale(1) brightness(.35)}

.snode .eq{position:absolute;left:-7px;top:-7px;width:16px;height:16px;border-radius:50%;background:#4fb34f;border:1px solid #000;box-shadow:0 0 6px #4fb34f}
.snode+.snode::before{content:"";position:absolute;left:50%;top:-16px;width:2px;height:14px;margin-left:-1px;background:linear-gradient(#6b5840,#3a2e21)}
.skinfo{margin-top:10px;padding:10px 12px;border:1px solid #3d3226;background:rgba(0,0,0,.35);font-size:15px;line-height:1.45}

.qcell.a{color:var(--quest);border-color:#6b4a22}.qcell.d{color:var(--good);border-color:#2f5a2f}.qcell.r{color:#ffd36a;border-color:#b8923a;box-shadow:0 0 8px rgba(255,211,106,.3)}
.dlg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}

<script>
'use strict';
/* ================= util ================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const chance = p => Math.random() < p;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const $ = id => document.getElementById(id);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const hyp = (x, y) => Math.sqrt(x * x + y * y);
function wpick(list, w) { let t = 0; for (const it of list) t += w(it); let r = Math.random() * t; for (const it of list) { r -= w(it); if (r <= 0) return it; } return list[list.length - 1]; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mulberry(seed) { let a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function fmt(n) { n = Math.round(n); if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M'; if (n >= 1e4) return Math.round(n / 1e3) + 'k'; return String(n); }
function fmtFull(n) { return Math.round(n).toLocaleString('en-US'); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* colour helpers */
function hexRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbHex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function shade(h, amt) { const [r, g, b] = hexRgb(h); if (amt >= 0) return rgbHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt); return rgbHex(r * (1 + amt), g * (1 + amt), b * (1 + amt)); }
function mix(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return rgbHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
function rgba(h, a) { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }

/* value noise (seeded) */
function makeNoise(seed) {
  const rnd = mulberry(seed); const P = new Uint8Array(512); const V = new Float32Array(256);
  for (let i = 0; i < 256; i++) { P[i] = i; V[i] = rnd(); }
  for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = P[i]; P[i] = P[j]; P[j] = t; }
  for (let i = 0; i < 256; i++) P[i + 256] = P[i];
  const sm = t => t * t * (3 - 2 * t);
  function n2(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y); const xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const a = V[P[P[X] + Y]], b = V[P[P[X + 1] + Y]], c = V[P[P[X] + Y + 1]], d = V[P[P[X + 1] + Y + 1]];
    const u = sm(xf), v = sm(yf);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }
  n2.fbm = (x, y, o = 4) => { let s = 0, a = 0.5, f = 1, t = 0; for (let i = 0; i < o; i++) { s += n2(x * f, y * f) * a; t += a; a *= 0.5; f *= 2.03; } return s / t; };
  // tileable version with period p
  n2.tile = (x, y, p) => {
    const xi = Math.floor(x), yi = Math.floor(y); const xf = x - xi, yf = y - yi;
    const m = k => ((k % p) + p) % p;
    const g = (i, j) => V[P[P[m(i) & 255] + (m(j) & 255)]];
    const u = sm(xf), v = sm(yf);
    return lerp(lerp(g(xi, yi), g(xi + 1, yi), u), lerp(g(xi, yi + 1), g(xi + 1, yi + 1), u), v);
  };
  n2.tfbm = (x, y, p, o = 4) => { let s = 0, a = 0.5, f = 1, t = 0; for (let i = 0; i < o; i++) { s += n2.tile(x * f, y * f, p * f) * a; t += a; a *= 0.5; f *= 2; } return s / t; };
  return n2;
}
const NOISE = makeNoise(1337);

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

/* storage (always guarded) */
const Store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};

/* iso projection: world tiles -> screen pixels (zoom 1) */
const TW = 64, TH = 32, HTW = 32, HTH = 16;
const isoX = (x, y) => (x - y) * HTW;
const isoY = (x, y) => (x + y) * HTH;
function screenToWorldVec(sx, sy) { const x = (sx / HTW + sy / HTH) / 2, y = (sy / HTH - sx / HTW) / 2; return [x, y]; }

/* ================= classes & skills ================= */
const sp = (b, l) => b * (1 + 0.3 * (l - 1) + 0.011 * (l - 1) * (l - 1));
const R = (lo, hi) => l => [sp(lo, l), sp(hi, l)];
const ELEM_NAME = { phys: 'Physical', fire: 'Fire', cold: 'Cold', light: 'Lightning', void: 'Void', spirit: 'Spirit' };
const ELEM_COL = { phys: '#e8e0d0', fire: '#ff7a2e', cold: '#7fc8ff', light: '#ffe066', void: '#b77dff', spirit: '#fff2c8' };
const STAT_NAME = { str: 'Strength', dex: 'Dexterity', vit: 'Vitality', spi: 'Spirit' };

const CLASSES = {
  vajra: {

/* ================= skill layout & synergies =================
   Every class has three columns:
     - two ACTIVE trees (arts that cast themselves), unlocked by tier and chained one after another
     - one PASSIVE tree ("Inner Practice"): always-on boons, unlocked by level only
   Three kinds of synergy turn leveled skills into new attacks, in the spirit of Vampire Survivors:
     EVOLUTION  an active art at level 8+ together with its matching passive at level 4+ transforms into a new, stronger art
     UNION      two equipped active arts, each at level 5+, grant each other a unique extra attack
     HARMONY    two passives, each at level 5+, grant a bonus together
   Effective levels (including item bonuses) are used throughout. */

/* ---------- icons: skills ---------- */
function skillIconCanvas(s, size = 64) {
  const key = s.id + size + s.icon[0] + s.icon[1]; if (ART.iconCv[key]) return ART.iconCv[key];
  const c = mkCanvas(size, size); const g = c.getContext('2d'); const k = size / 64; g.scale(k, k);
  const [shape, col] = s.icon;
  g.fillStyle = rgrad(g, 32, 30, 2, 44, [[0, shade(col, -0.35)], [0.6, shade(col, -0.72)], [1, '#070504']]); g.fillRect(0, 0, 64, 64);
  g.save(); g.shadowColor = col; g.shadowBlur = 10;
  drawSymbol(g, shape, col);
  g.restore();
  // bevel frame
  g.strokeStyle = '#1a120a'; g.lineWidth = 4; g.strokeRect(2, 2, 60, 60); g.strokeStyle = '#8a7050'; g.lineWidth = 1.5; g.strokeRect(3.5, 3.5, 57, 57);
  g.globalAlpha = 0.18; g.fillStyle = ART.gritPat || '#000'; g.fillRect(0, 0, 64, 64);
  ART.iconCv[key] = c; return c;
}
function drawSymbol(g, shape, col) {
  const L = shade(col, 0.55), W = '#fffaf0';
  const star = (x, y, r, n, inner) => { g.beginPath(); for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * TAU - Math.PI / 2; const rr = i % 2 ? r * inner : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); };
  switch (shape) {
    case 'vajra': ball(g, 32, 32, 5, 5, L); for (const d of [-1, 1]) { g.strokeStyle = L; g.lineWidth = 3; for (const a of [-0.35, 0, 0.35]) { g.beginPath(); g.moveTo(32, 32 + d * 6); g.quadraticCurveTo(32 + Math.sin(a) * 26, 32 + d * 14, 32, 32 + d * 24); g.stroke(); } } break;
    case 'orb': ball(g, 32, 32, 13, 13, L, 0.6, -0.2); break;
    case 'burst': star(32, 32, 24, 10, 0.45); g.fillStyle = L; g.fill(); ball(g, 32, 32, 7, 7, W); break;
    case 'chain': g.strokeStyle = L; g.lineWidth = 3; g.beginPath(); g.moveTo(10, 20); g.lineTo(26, 36); g.lineTo(22, 26); g.lineTo(40, 44); g.lineTo(36, 32); g.lineTo(54, 48); g.stroke(); for (const [x, y] of [[10, 20], [54, 48], [32, 30]]) ball(g, x, y, 4, 4, W); break;
    case 'bolt': poly(g, [36, 6, 18, 36, 30, 36, 24, 58, 46, 26, 34, 26, 42, 6], L); break;
    case 'shield': poly(g, [32, 8, 52, 16, 50, 36, 32, 56, 14, 36, 12, 16], L); poly(g, [32, 14, 46, 20, 44, 34, 32, 48, 20, 34, 18, 20], shade(col, -0.3)); break;
    case 'eye': ellipse(g, 32, 32, 22, 11, L); ball(g, 32, 32, 8, 8, shade(col, -0.5)); ellipse(g, 32, 32, 3, 3, '#000'); break;
    case 'wheel': case 'pwheel': g.strokeStyle = L; g.lineWidth = 3.5; g.beginPath(); g.arc(32, 32, 18, 0, TAU); g.stroke(); g.beginPath(); g.arc(32, 32, 5, 0, TAU); g.stroke(); for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; line(g, 32 + Math.cos(a) * 5, 32 + Math.sin(a) * 5, 32 + Math.cos(a) * 18, 32 + Math.sin(a) * 18, L, 2); } if (shape === 'pwheel') line(g, 32, 50, 32, 60, L, 4); break;
    case 'mountain': poly(g, [6, 52, 26, 16, 34, 28, 42, 18, 58, 52], L); poly(g, [26, 16, 22, 26, 30, 24], W); break;
    case 'diamond': poly(g, [32, 8, 52, 26, 32, 56, 12, 26], L); poly(g, [32, 8, 40, 26, 32, 56, 24, 26], W); break;
    case 'fist': ball(g, 32, 34, 14, 12, L); for (let i = 0; i < 4; i++) ellipse(g, 22 + i * 7, 24, 3.6, 5, shade(col, 0.3)); poly(g, [20, 44, 44, 44, 40, 58, 24, 58], L); break;
    case 'deity': ball(g, 32, 22, 9, 10, L); poly(g, [18, 58, 22, 34, 42, 34, 46, 58], L); for (const s of [-1, 1]) { line(g, 32 + s * 10, 38, 32 + s * 24, 26, L, 3); line(g, 32 + s * 10, 42, 32 + s * 24, 50, L, 3); } poly(g, [24, 14, 28, 6, 32, 12, 36, 6, 40, 14], W); break;

/* sprite builder for any look (frames 0..3 walk, 4 attack) */
function buildCreature(key, L, nFrames = 5, scale) {
  if (ART.cre[key]) return ART.cre[key];
  const H = L.h; const W = Math.ceil(H * (L.body === 'quad' ? 2.4 : L.body === 'bird' ? 2 : 1.9) + 28), Hc = Math.ceil(H * (L.body === 'naga' ? 1.2 : 1.45) + 30);
  const frames = [], mframes = [];
  for (let f = 0; f < nFrames; f++) {
    const sp = newSpr(W, Hc, W / 2, Hc - 10, scale); const g = sp.g; const bx = W / 2, by = Hc - 10;
    switch (L.body) {
      case 'human': paintHumanoid(g, L, f, bx, by); break;
      case 'quad': paintQuad(g, L, f, bx, by); break;
      case 'bird': paintBird(g, L, f, bx, by); break;
      case 'ghost': paintGhost(g, L, f, bx, by); break;
      case 'wisp': paintWisp(g, L, f, bx, by); break;
      case 'swarm': paintSwarm(g, L, f, bx, by); break;
      case 'serpent': paintSerpent(g, L, f, bx, by); break;
      case 'naga': paintNaga(g, L, f, bx, by); break;
      case 'head': paintHeadBeast(g, L, f, bx, by); break;
      case 'blob': paintBlob(g, L, f, bx, by); break;
      case 'tree': paintTree(g, L, f, bx, by); break;
    }
    const glowy = L.body === 'wisp' || L.body === 'ghost' || L.body === 'swarm';
    finishSpr(sp, { outline: glowy ? 0 : 1, grit: glowy ? 0 : 0.14, dark: glowy ? 0.15 : 0.36, shade: glowy ? 0 : 1 });
    frames.push(sp); mframes.push(mirrorSpr(sp));

  const o = { frames, mframes, H };
  ART.cre[key] = o; return o;
}

function loop() {

    let dt = Math.min(0.05, (now - last) / 1000); last = now;
    try {
      if (G.state === 'title') titleLoop(dt);
      else if (G.state === 'create') createLoop(dt);
      else if (G.state === 'cine') CINE.update(dt);
      else if (G.A && G.P) { if (G.state === 'play') update(dt); render(G.state === 'play' ? dt : 0); UI.hud(); if (G.state === 'play') perfWatch(now); }
    } catch (err) { console.error(err); if (!G._errShown) { G._errShown = 1; toast('Something went wrong', String(err.message || err).slice(0, 80), 6); } }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

function perfWatch(now) {
  if (OPT.quality === 'low' || PERF.done) return; if (!PERF.t0 || now - PERF.last > 250) { PERF.t0 = now; PERF.n = 0; PERF.last = now; return; } PERF.last = now; PERF.n++;
  if (now - PERF.t0 > 6000) { const fps = PERF.n / ((now - PERF.t0) / 1000); PERF.t0 = now; PERF.n = 0; PERF.checks++;
    if (fps < 34) { PERF.slow = (PERF.slow || 0) + 1; if (PERF.slow >= 2) { PERF.done = 1; OPT.quality = 'low'; saveOpt(); resizeCanvas(); if (G.A) G.A.chunks.clear(); toast('Switched to fast graphics', 'You can change this in Options', 3); } } else PERF.slow = 0;
    if (PERF.checks > 20) PERF.done = 1; }
}
